<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Everything PDF</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'><rect x='2' y='2' width='52' height='52' rx='9' fill='%231c1d1a'/><path d='M19 12 L12 12 L12 19' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='square'/><path d='M37 12 L44 12 L44 19' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='square'/><path d='M12 37 L12 44 L19 44' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='square'/><path d='M44 37 L44 44 L37 44' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='square'/></svg>" />
<style>
  :root {
    --bg: #fafaf7;
    --surface: #ffffff;
    --border: #e4e2d9;
    --border-strong: #d2cfc2;
    --text: #1c1d1a;
    --text-dim: #5e605a;
    --text-faint: #96968c;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;

    --blue: #2563eb;
    --blue-soft: #eaf0fe;
    --indigo: #4338ca;
    --indigo-soft: #eeecfb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  header { text-align: center; margin-bottom: 44px; }
  .wm { font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .wm b { font-weight: 700; color: var(--text); }
  header p { margin: 8px 0 0; font-size: 14px; color: var(--text-dim); }

  .tiles {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 700px;
  }

  .tile {
    --accent: var(--text);
    --accent-soft: var(--surface);
    width: 300px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 40px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
  }
  .tile:hover, .tile:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .07);
    transform: translateY(-2px);
    outline: none;
  }
  .tile:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .tile .mark { width: 72px; height: 72px; display: block; }

  .tile .name { font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
  .tile.pics2pdf .name span { color: var(--blue); }
  .tile.pdfeditor .name b { color: var(--indigo); font-weight: 700; }

  .tile .desc { font-size: 13px; color: var(--text-dim); text-align: center; line-height: 1.5; }

  .tile.pics2pdf { --accent: var(--blue); --accent-soft: var(--blue-soft); }
  .tile.pdfeditor { --accent: var(--indigo); --accent-soft: var(--indigo-soft); }

  footer { margin-top: 48px; font-size: 11.5px; color: var(--text-faint); }
</style>
</head>
<body>

  <header>
    <div class="wm">everything<b>pdf</b></div>
    <p>Pick a tool to get started.</p>
  </header>

  <div class="tiles">
    <a class="tile pics2pdf" href="pics2pdf/index.html">
      <svg class="mark" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="52" height="52" rx="10" fill="#2563EB"/>
        <path d="M19 12 L12 12 L12 19" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="square"/>
        <path d="M37 12 L44 12 L44 19" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="square"/>
        <path d="M12 37 L12 44 L19 44" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="square"/>
        <path d="M44 37 L44 44 L37 44" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="square"/>
        <text x="28" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#fff" style="letter-spacing:-0.02em">2</text>
      </svg>
      <div class="name">pics<span>2</span>pdf</div>
      <div class="desc">Turn photos into a polished PDF — drag, reorder, and export.</div>
    </a>

    <a class="tile pdfeditor" href="everything-pdf/index.html">
      <svg class="mark" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="54" height="54" rx="9" fill="#4338ca"/>
        <path d="M12 19 L12 12 L19 12" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="square"/>
        <path d="M44 19 L44 12 L37 12" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="square"/>
        <path d="M12 37 L12 44 L19 44" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="square"/>
        <path d="M44 37 L44 44 L37 44" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="square"/>
        <rect x="19" y="25" width="18" height="2.6" fill="#fff"/>
        <rect x="19" y="31" width="11" height="2.6" fill="#fff"/>
      </svg>
      <div class="name">PDF <b>Editor</b></div>
      <div class="desc">Drop in any PDF, place fields, fill, sign, and export.</div>
    </a>
  </div>

  <footer>Built and managed by SC Design &amp; Consultation</footer>

</body>
</html>
